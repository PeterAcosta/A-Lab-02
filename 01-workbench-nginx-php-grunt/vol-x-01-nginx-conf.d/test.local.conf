

server {
    listen 80;
    listen [::]:80;             # IPv6
    server_name test.local www.test.local;
    return 301 https://test.local$request_uri;
}



server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.test.local;
    return 301 https://test.local$request_uri;
    ### Certificados SSL
    # ssl_certificate_key /x-include/CloudFlare/cloudflare-ssl-01-ceco.net.key;
    # ssl_certificate     /x-include/CloudFlare/cloudflare-ssl-01-ceco.net.pem;

    ssl_certificate_key  /x-include/Certificado-autofirmado/test.local.key;
    ssl_certificate      /x-include/Certificado-autofirmado/test.local.pem;
}



server {

    listen 443 ssl;
    listen [::]:443 ssl;        # IPv6
    http2  on;

    server_name test.local;
    root /var/www/test;
    index index.php index.html ;


    # error_page 404 /404.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;



    # Configuración específica para PHP 8.2.9
    location ~ \.php$ {
        fastcgi_pass my-02-php-8-fpm:9000;       # ATENCION: "my-02-php-8-fpm" debe ser igual al servicio declarado en docker-compose.yaml
        fastcgi_index index.php;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    



    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|txt)$ {
        access_log off;
        # expires 30d;
        # expires 10d;
        # expires 8h;
        # expires 30m;
        expires 2m;
    }


    gzip on;
    gzip_comp_level 5;   ## Nivel de compresion 5 puede ser mucho, tal vez 3 sea suficiente
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    ## CUIDADO : Esto hizo que el javascript no funcionara
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-Content-Type-Options "nosniff";
    # add_header X-XSS-Protection "1; mode=block";
